name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Necessário para gravar os badges de cobertura no repositório
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Testcontainers usa o Docker já disponível no runner
      - name: Build e testes
        run: mvn -B verify

      - name: Relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Badges de cobertura
        if: github.event_name == 'push'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true

      # Commits feitos com o GITHUB_TOKEN não disparam outro workflow, então não entra em loop
      - name: Salvar badges
        if: github.event_name == 'push'
        run: |
          if [[ -n $(git status --porcelain .github/badges) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges
            git commit -m "chore: atualiza badges de cobertura"
            git push
          fi
